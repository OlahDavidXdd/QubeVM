name: Android native loading smoke test
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: APK build run ID
        default: '46039115694'
        required: true
  push:
    branches: [llmos]
    paths: ['.github/workflows/android-smoke.yml', 'ci/android-smoke.sh']
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download latest successful x86-64 APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN: ${{ inputs.run_id || '46039115694' }}
        run: |
          gh run download "$APK_RUN" --name LLMOS-x86_64-debug --dir apk
      - name: Enable KVM for Android test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash ci/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: smoke/
