name: LLM.OS APK
on:
  workflow_dispatch:
  push:
    branches: [llmos]
    paths-ignore: ["LLMOS.md", "docs/**"]
permissions:
  contents: read
  actions: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
      - run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake libtool-bin flex bison gettext texinfo rsync gtk-doc-tools ninja-build python3-pip xorriso
          pip install --break-system-packages meson mako packaging
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/cache@v4
        with:
          path: |
            qube-android-lib/src/main/jni/qemu
            qube-android-lib/src/main/jni/glib
            qube-android-lib/src/main/jni/libffi
            qube-android-lib/src/main/jni/pixman
            qube-android-lib/src/main/jni/libepoxy
            qube-android-lib/src/main/jni/virglrenderer
            qube-android-lib/src/main/obj
          key: native-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('ci/native-sources.json', 'ci/fetch-native.py', 'qube-android-lib/src/main/jni/*.mak', 'qube-android-lib/src/main/jni/Makefile', 'qube-android-lib/src/main/jni/android-config/**', 'qube-android-lib/src/main/jni/patches/**') }}
      - run: python3 ci/fetch-native.py
      - name: Compile QEMU and JNI
        run: make -C qube-android-lib/src/main/jni qube
        env:
          NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
          BUILD_HOST: ${{ matrix.abi }}
          BUILD_GUEST: x86_64-softmmu
          USE_QEMU_VERSION: 11.1.3
          USE_KVM: 'false'
      - uses: actions/download-artifact@v4
        id: guest_archive
        continue-on-error: true
        with:
          name: llm-asm-original-ISO
          run-id: '46035265522'
          github-token: ${{ github.token }}
          path: guest-media
      - name: Rebuild original media if retained artifact is unavailable
        if: steps.guest_archive.outcome == 'failure'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils grub-pc-bin grub-efi-amd64-bin mtools xorriso
          pip install --break-system-packages numpy huggingface_hub
          git clone https://github.com/alesha-pro/llm.asm.git guest
          git -C guest checkout 48feccbfd57cb669440f31ff64958d95bb8b848e
          python3 ci/build-guest.py
          mkdir -p guest-media
          cp guest/build/*.iso guest/build/SHA256SUMS guest-media/
      - name: Verify and prepare original Multiboot payload
        run: python3 ci/prepare-bundled-media.py
      - name: Build signed debug APK
        run: |
          for attempt in 1 2 3; do
            ./gradlew :qube-android-x86:assembleDebug -PqemuVersion=11.1.3 --max-workers=2 && break
            test "$attempt" -lt 3 || exit 1
            sleep 30
          done
      - name: Verify APK native payload and signature
        run: |
          python3 ci/verify-apk.py qube-android-x86/build/outputs/apk/debug/*.apk ${{ matrix.abi }}
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose qube-android-x86/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LLMOS-${{ matrix.abi }}-debug
          path: qube-android-x86/build/outputs/apk/debug/*.apk
          if-no-files-found: error
